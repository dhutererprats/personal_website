<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Right-hand rule for magnetic force</title>
  <desc id="desc">Velocity to the right, magnetic field up, force for positive charge out of page.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8ad3ff"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#121b2f"/>

  <circle cx="450" cy="270" r="130" fill="none" stroke="#6f88b7" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="450" cy="270" r="12" fill="#f5f7fa"/>
  <circle cx="450" cy="270" r="4" fill="#121b2f"/>
  <text x="450" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f5f7fa">+q (out of page target)</text>

  <line x1="450" y1="270" x2="700" y2="270" stroke="#8ad3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="712" y="278" font-family="Arial, sans-serif" font-size="22" fill="#8ad3ff">v</text>

  <line x1="450" y1="270" x2="450" y2="80" stroke="#6cf3c2" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="462" y="74" font-family="Arial, sans-serif" font-size="22" fill="#6cf3c2">B</text>

  <line x1="450" y1="270" x2="450" y2="160" stroke="#ffd166" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="463" y="154" font-family="Arial, sans-serif" font-size="22" fill="#ffd166">F = q(v x B)</text>

  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#e4eefb">Right-hand rule: v right, B up => force out of page</text>
</svg>
